<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>바나나 숙성도 판별</title>
<meta name="theme-color" content="#ffd55b">
<link rel="icon" href="./frontend/icon-192.png">
<!-- GitHub Pages 는 저장소 최상위에서 index.html 을 찾는다. 화면 파일은
     frontend/ 안에 있으므로 여기서 넘겨준다. JS 가 꺼져 있어도 넘어가도록
     meta refresh 를 함께 둔다. -->
<meta http-equiv="refresh" content="0; url=./frontend/index.html">
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       background:#ffd55b;color:#4a3a10;text-align:center;
       font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
  img{width:88px;height:88px;border-radius:22px;display:block;margin:0 auto 1.1rem}
  p{margin:0;font-size:.95rem}
  a{color:#4a3a10;font-weight:700}
</style>
</head>
<body>
  <div>
    <img src="./frontend/icon-192.png" alt="">
    <p>앱 화면으로 이동하고 있습니다…</p>
    <p style="margin-top:.6rem"><a href="./frontend/index.html">바로 열기</a></p>
  </div>
  <script>location.replace("./frontend/index.html");</script>
</body>
</html>
